[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drtl-cmc"
version = "0.1.0"
description = "Doubly robust target inference for GLM regression with completely missing covariates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["drtl_cmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
